<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SmartERP - Stock Movement</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;

            background: #f4f6f8;

            margin: 0;

            padding: 40px;
        }

        .container {
            max-width: 650px;

            margin: auto;

            background: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow:
                0 3px 15px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;

            margin-bottom: 25px;
        }

        form p {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 6px;

            font-weight: bold;
        }

        input,
        select {
            width: 100%;

            padding: 11px;

            border: 1px solid #d1d5db;

            border-radius: 6px;

            font-size: 14px;
        }

        .help-text {
            color: #6b7280;

            font-size: 13px;

            margin-top: 5px;
        }

        .errorlist {
            color: #dc2626;

            margin: 5px 0;

            padding-left: 20px;
        }

        .buttons {
            display: flex;

            gap: 10px;

            margin-top: 25px;
        }

        button,
        a {
            padding: 11px 18px;

            border-radius: 6px;

            text-decoration: none;

            font-weight: bold;

            cursor: pointer;
        }

        button {
            border: none;

            background: #2563eb;

            color: white;
        }

        .cancel {
            background: #e5e7eb;

            color: #374151;
        }

    </style>

</head>


<body>

<div class="container">

    <h2>
        Stock In / Stock Out
    </h2>

    <p class="subtitle">
        Record inventory stock movement.
    </p>


    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}


        <div class="buttons">

            <button type="submit">
                Record Movement
            </button>

            <a
                href="{% url 'product_list' %}"
                class="cancel"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

</body>

</html>
