<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SmartERP - Delete Product</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;

            background: #f4f6f8;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;
        }

        .container {
            width: 450px;

            background: white;

            padding: 35px;

            border-radius: 10px;

            text-align: center;

            box-shadow:
                0 3px 15px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-bottom: 15px;

            color: #1f2937;
        }

        p {
            color: #6b7280;

            margin-bottom: 25px;
        }

        .product {
            font-weight: bold;

            color: #1f2937;
        }

        .buttons {
            display: flex;

            justify-content: center;

            gap: 10px;
        }

        button,
        a {
            padding: 11px 18px;

            border-radius: 6px;

            border: none;

            text-decoration: none;

            font-weight: bold;

            cursor: pointer;
        }

        .delete {
            background: #dc2626;

            color: white;
        }

        .cancel {
            background: #e5e7eb;

            color: #374151;
        }

    </style>

</head>


<body>

<div class="container">

    <h2>
        Delete Product?
    </h2>

    <p>

        Are you sure you want to delete

        <span class="product">

            {{ product.name }}

        </span>

        ({{ product.product_code }})?

    </p>


    <div class="buttons">

        <form method="post">

            {% csrf_token %}

            <button
                type="submit"
                class="delete"
            >
                Yes, Delete
            </button>

        </form>


        <a
            href="{% url 'product_list' %}"
            class="cancel"
        >
            Cancel
        </a>

    </div>

</div>

</body>

</html>
